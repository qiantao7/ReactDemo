services:
  db:
    image: public.ecr.aws/docker/library/postgres:15
    restart: always
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app_db"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql://app:app_password@db:5432/app_db?schema=public
      NODE_ENV: production
      JWT_SECRET: super_secret_change_me
      AUTH_COOKIE_SECURE: "false"
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  uploads_data:
